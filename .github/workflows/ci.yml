name: CI Build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Keep this deliberately identical in shape to the owner-signing flow that is already
      # proven in OneuiXP: decode the secret once, then give that keystore to Gradle.
      - name: Load owner signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing repository Actions secret ${key}."
              exit 1
            fi
          done

          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/owner.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          KEYTOOL_INFO="$RUNNER_TEMP/owner-key.txt"
          keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" > "$KEYTOOL_INFO"
          KEYSTORE_TYPE="$(sed -n 's/^Keystore type: //p' "$KEYTOOL_INFO" | head -n 1 | tr -d '\r')"
          if [ -z "$KEYSTORE_TYPE" ]; then
            echo "::error::Could not determine owner keystore type."
            exit 1
          fi
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "KEYSTORE_TYPE=$KEYSTORE_TYPE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Owner signing key loaded successfully ($KEYSTORE_TYPE)."

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Verify package, version and owner signature
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          DEBUG_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -s "$RELEASE_APK"
          test -s "$DEBUG_APK"

          EXPECTED_SHA256="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -m 1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
          test -n "$EXPECTED_SHA256"

          for APK in "$RELEASE_APK" "$DEBUG_APK"; do
            CERT="$($APKSIGNER verify --verbose --print-certs "$APK")"
            SIGNED_SHA256="$(printf '%s\n' "$CERT" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ': ' | tr 'A-F' 'a-f')"
            if [ "$SIGNED_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::$APK is not signed by the repository owner key."
              exit 1
            fi
          done

          BADGING="$($AAPT dump badging "$RELEASE_APK")"
          printf '%s\n' "$BADGING" | grep -q "^package: name='dev.rootmygalaxy.rmgxp'"
          printf '%s\n' "$BADGING" | grep -q "versionName='1.0.261002'"
          printf '%s\n' "$BADGING" | grep -q "versionCode='2'"

          {
            echo "### Owner-signed CI build"
            echo
            echo "- Version: 1.0.261002"
            echo "- Version code: 2"
            echo "- Certificate SHA-256: $EXPECTED_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: RootMyGalaxyXP-1.0.261002-ci${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
