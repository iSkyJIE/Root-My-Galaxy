files:
  # Both paths are relative to the repository and deliberately have no leading slash: with one,
  # the download writes to that path from the filesystem root instead of from the checkout, so
  # the files land outside the working tree and git has nothing to commit.
  - source: app/src/main/res/values/strings.xml
    translation: app/src/main/res/values-%android_code%/%original_file_name%

    # Crowdin's own Android code for a language is regional - German is `de-rDE`, French is
    # `fr-rFR`, Japanese is `ja-rJP` - and Android's placeholder would write `values-de-rDE`,
    # `values-fr-rFR` and `values-ja-rJP`: folders this app does not have, next to the ones it
    # does. The app's folders are named for the language alone, so each is named here instead.
    #
    # The format is Crowdin's language id: the code the placeholder should produce. Adding a
    # language is an edit here, a folder in the repository and a pull request - the folder has
    # to exist before an export may write to it, which is what stops one arriving by accident.
    languages_mapping:
      android_code:
        de: de
        fr: fr
        ja: ja
        ko: ko
        pt-BR: pt-rBR
        ru: ru
        tr: tr
        uz: uz
        vi: vi
        zh-CN: zh-rCN
        zh-TW: zh-rTW
